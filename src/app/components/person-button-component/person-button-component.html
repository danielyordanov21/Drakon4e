<div class="person-picker" (keydown.escape)="closeMenu()">
  <button
    type="button"
    class="person-picker__trigger"
    [attr.aria-expanded]="isOpen()"
    aria-controls="person-picker-options"
    (click)="toggleMenu()"
  >
    Select a person
    <span class="person-picker__chevron" aria-hidden="true">⌄</span>
  </button>

  @if (isOpen()) {
    <div class="person-picker__dropdown" id="person-picker-options" aria-label="People">
      @if (loading()) {
        <p class="person-picker__status" role="status">Loading people…</p>
      } @else if (errorMessage(); as error) {
        <p class="person-picker__error" role="alert">{{ error }}</p>
      } @else {
        <a
          class="person-picker__option"
          routerLink="/"
          (click)="closeMenu()"
        >
          All people
        </a>
        @for (person of people(); track person.id) {
          <a
            class="person-picker__option"
            [routerLink]="['/people', person.id]"
            (click)="closeMenu()"
          >
            {{ person.name }}
          </a>
        } @empty {
          <p class="person-picker__status">No people found.</p>
        }
      }
    </div>
  }
</div>
